name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [claude/signature-platform-build-xlkazn, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Pages is static hosting — server routes can't run there.
      # The demo falls back to client-side seeded analytics automatically.
      - name: Remove server-only routes for static export
        run: rm -rf src/app/api

      - name: Build static export
        run: npm run build
        env:
          NEXT_STATIC_EXPORT: "1"

      # Publishing to the gh-pages branch auto-enables Pages for the repo
      # (branch-based deployment) — no manual settings step required.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
