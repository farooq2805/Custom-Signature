name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [claude/signature-platform-build-xlkazn, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Pages is static hosting — server routes can't run there.
      # The demo falls back to client-side seeded analytics automatically.
      - name: Remove server-only routes for static export
        run: rm -rf src/app/api

      - name: Build static export
        run: npm run build
        env:
          NEXT_STATIC_EXPORT: "1"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
